<p-dialog header="Cambiar Contraseña" [visible]="visible" (visibleChange)="!$event && close()" (onShow)="onShow()"
   [modal]="true" [draggable]="false" [resizable]="false" [closable]="!saving()"
   [style]="{ width: '440px', maxWidth: '95vw' }">
   <form class="flex flex-column gap-3 pt-2" (ngSubmit)="submit()" autocomplete="off">
      <div class="flex flex-column gap-1">
         <label for="cp-current" class="text-sm font-semibold text-900">Contraseña actual <span class="text-red-500">*</span></label>
         <p-password inputId="cp-current" name="currentPassword" [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)"
            [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password"></p-password>
      </div>

      <div class="flex flex-column gap-1">
         <label for="cp-new" class="text-sm font-semibold text-900">Nueva contraseña <span class="text-red-500">*</span></label>
         <p-password inputId="cp-new" name="newPassword" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)"
            [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
         <span class="text-xs text-500">Mínimo {{ minLength }} caracteres.</span>
      </div>

      <div class="flex flex-column gap-1">
         <label for="cp-confirm" class="text-sm font-semibold text-900">Confirmar nueva contraseña <span class="text-red-500">*</span></label>
         <p-password inputId="cp-confirm" name="confirmPassword" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
            [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
      </div>

      <small *ngIf="errorMessage()" class="text-red-500 font-semibold">{{ errorMessage() }}</small>

      <!-- Botón oculto para permitir enviar con Enter -->
      <button type="submit" class="hidden" [disabled]="saving()"></button>
   </form>

   <ng-template pTemplate="footer">
      <div class="flex justify-content-end gap-2 pt-2">
         <p-button label="Cancelar" [text]="true" severity="secondary" [disabled]="saving()" (onClick)="close()"></p-button>
         <p-button label="Guardar" [loading]="saving()" (onClick)="submit()"></p-button>
      </div>
   </ng-template>
</p-dialog>
