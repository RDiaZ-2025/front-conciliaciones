<p-toast></p-toast>
<p-confirmDialog>
  <ng-template pTemplate="message" let-message>
    <div class="flex align-items-center gap-3 w-full">
      <lucide-icon name="alert-triangle" class="text-red-500 text-3xl" style="flex-shrink: 0;"></lucide-icon>
      <span class="text-sm text-700 font-semibold">{{ message.message }}</span>
    </div>
  </ng-template>
</p-confirmDialog>

<div class="flex flex-column gap-4 p-4">
  <app-page-header title="Gestión de Equipos" subtitle="Administra los equipos, líderes, condiciones y miembros" icon="users">
    <p-button (onClick)="openNew()"><lucide-icon name="plus" class="mr-2"></lucide-icon>Nuevo Equipo</p-button>
  </app-page-header>

  <div class="card">
    <p-table [value]="teams()" [loading]="loading()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre del Equipo</th>
          <th>Líder de Equipo</th>
          <th>Descripción</th>
          <th class="text-center">Miembros</th>
          <th style="width: 10rem" class="text-center">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-team>
        <tr>
          <td class="font-bold text-900">{{ team.name }}</td>
          <td>
            <div *ngIf="team.leader" class="flex align-items-center gap-2">
              <lucide-icon name="user-check" class="text-primary text-sm"></lucide-icon>
              <div class="flex flex-column">
                <span class="font-semibold text-sm">{{ team.leader.name }}</span>
                <span class="text-xs text-500">{{ team.leader.email }}</span>
              </div>
            </div>
            <span *ngIf="!team.leader" class="text-xs text-400 italic">Sin líder asignado</span>
          </td>
          <td>{{ team.description || 'Sin descripción' }}</td>
          <td class="text-center">
            <p-badge [value]="(team.users?.length || 0).toString()" severity="secondary"></p-badge>
          </td>
          <td class="text-center">
            <div class="flex justify-content-center gap-2">
              <p-button (onClick)="editTeam(team)" [rounded]="true" [text]="true" severity="info" pTooltip="Editar"><lucide-icon name="pencil"></lucide-icon></p-button>
              <p-button (onClick)="deleteTeam(team)" [rounded]="true" [text]="true" severity="danger" pTooltip="Eliminar"><lucide-icon name="trash-2"></lucide-icon></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center p-4">No hay equipos registrados</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-team-dialog 
  [(visible)]="dialogVisible" 
  [team]="editingTeam()"
  (save)="onSave()">
</app-team-dialog>
