name: Deploy Backend - Main (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-main.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies and build backend
        run: |
          npm ci
          npm run build:backend

      - name: Prepare deployment package
        run: |
          mkdir deploy-package
          cp -r backend/dist deploy-package/dist
          cp backend/package.json deploy-package/
          cp backend/web.config deploy-package/
          echo "[config]" > deploy-package/.deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> deploy-package/.deployment
          echo "command = echo \"Pre-built package with node_modules deployed successfully.\"" >> deploy-package/.deployment
          cd deploy-package
          npm install --omit=dev --no-audit --no-fund
          zip -q -r ../deploy-package.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-main
          path: deploy-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy Backend Main to Azure Web App
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-main
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_MAIN || secrets.AZUREAPPSERVICE_CLIENTID_890F8176E9C843C9AE450A6E4EE92931 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_MAIN || secrets.AZUREAPPSERVICE_TENANTID_EC1F12A7860844638668E27F3777D0E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_MAIN || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55435E58914E475F8CCF09AEC5D3D083 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'voc-backend'
          slot-name: 'Production'
          package: ./deploy-package.zip
