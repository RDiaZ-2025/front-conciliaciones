name: Deploy Backend - Main (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend-main.yml'
  workflow_dispatch:
    inputs:
      force_deps:
        description: 'Force reinstall and upload of node_modules'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Check for dependency changes
        id: check_deps
        run: |
          if [ "${{ github.event.inputs.force_deps }}" = "true" ]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
            echo "Dependencies forcefully included via workflow_dispatch."
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            LOCK_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "^(package-lock\.json|backend/package-lock\.json)$" || true)
            DEPS_DIFF=$(git diff -U0 HEAD~1 HEAD -- package.json backend/package.json 2>/dev/null | grep -E '^[-+][ ]*"' | grep -vE '"version"|"versionDate"' || true)
            if [ -n "$LOCK_CHANGED" ] || [ -n "$DEPS_DIFF" ]; then
              echo "CHANGED=true" >> "$GITHUB_OUTPUT"
              echo "Dependency changes detected in commit:"
              [ -n "$LOCK_CHANGED" ] && echo "- Lockfile modified: $LOCK_CHANGED"
              [ -n "$DEPS_DIFF" ] && echo "- Package diff: $DEPS_DIFF"
              echo "node_modules will be installed and synchronized."
            else
              echo "CHANGED=false" >> "$GITHUB_OUTPUT"
              echo "No dependency changes detected (version bump / code only). Fast code-only deployment."
            fi
          else
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit found. Defaulting to full deployment with dependencies."
          fi

      - name: Install dependencies and build backend
        run: |
          npm ci
          npm run build:backend

      - name: Prepare deployment package
        run: |
          mkdir deploy-package
          cp -r backend/dist deploy-package/dist
          cp backend/package.json deploy-package/
          cp backend/web.config deploy-package/
          cp backend/deploy.cmd deploy-package/
          echo "[config]" > deploy-package/.deployment
          echo "command = deploy.cmd" >> deploy-package/.deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> deploy-package/.deployment
          cd deploy-package
          if [ "${{ steps.check_deps.outputs.CHANGED }}" = "true" ]; then
            echo "Packaging dependencies into deployment bundle..."
            npm install --omit=dev --no-audit --no-fund
          else
            echo "Skipping node_modules packaging (differential deployment)."
          fi
          shopt -s dotglob
          zip -q -r ../deploy-package.zip *

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-main
          path: deploy-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy Backend Main to Azure Web App
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-main
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_MAIN || secrets.AZUREAPPSERVICE_CLIENTID_890F8176E9C843C9AE450A6E4EE92931 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_MAIN || secrets.AZUREAPPSERVICE_TENANTID_EC1F12A7860844638668E27F3777D0E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_MAIN || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55435E58914E475F8CCF09AEC5D3D083 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'voc-backend'
          slot-name: 'Production'
          package: ./deploy-package.zip
