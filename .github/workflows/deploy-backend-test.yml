name: Deploy Backend - Test

on:
  push:
    branches:
      - test
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-test.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies and build backend
        run: |
          npm ci
          npm run build:backend

      - name: Prepare deployment package
        run: |
          mkdir deploy-package
          cp -r backend/dist deploy-package/dist
          cp backend/package.json deploy-package/
          cp backend/web.config deploy-package/
          echo "[config]" > deploy-package/.deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> deploy-package/.deployment
          cd deploy-package
          npm install --omit=dev --no-audit --no-fund
          shopt -s dotglob
          zip -q -r ../deploy-package.zip *

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-test
          path: deploy-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy Backend Test to Azure Web App
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-test
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_TEST }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_TEST }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_TEST }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ vars.AZUREAPPSERVICE_APPNAME_TEST || 'voc-backend-test' }}
          slot-name: 'Production'
          package: ./deploy-package.zip
