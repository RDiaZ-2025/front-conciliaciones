name: Deploy Frontend - Test

on:
  push:
    branches:
      - test
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-test.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - test
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-test.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend Test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TEST }}
          action: "upload"
          app_location: "frontend"
          api_location: ""
          output_location: "dist/voc/browser"
          app_build_command: "npm run build:test"
        env:
          NODE_VERSION: '22.22.0'

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TEST }}
          action: "close"
