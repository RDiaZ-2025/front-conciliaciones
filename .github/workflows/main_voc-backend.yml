name: Build and deploy Node.js app to Azure Web App - voc-backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_voc-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies and build backend
        run: |
          npm ci
          npm run build:backend

      - name: Prepare deployment package
        run: |
          mkdir deploy-package
          cp -r backend/dist deploy-package/dist
          cp backend/package.json deploy-package/
          cp backend/web.config deploy-package/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_890F8176E9C843C9AE450A6E4EE92931 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC1F12A7860844638668E27F3777D0E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55435E58914E475F8CCF09AEC5D3D083 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'voc-backend'
          slot-name: 'Production'
          package: .